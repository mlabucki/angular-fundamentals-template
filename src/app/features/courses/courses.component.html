<app-search
  placeholder="Search courses..."
  (search)="onSearchCourses($event)"
></app-search>

<div class="add-course-section">
  <app-button buttonText="ADD NEW COURSE" (click)="onAddNewCourse()">
  </app-button>
</div>

<app-courses-list
  [courses]="coursesList"
  [editable]="true"
  (showCourse)="showInfo($event)"
  (editCourse)="editCourse($event)"
  (deleteCourse)="deleteCourse($event)"
  *ngIf="listVisible; else infoTemplate"
>
</app-courses-list>
<ng-template #infoTemplate>
  <app-course-info
    [course]="detailedCourse"
    (backClick)="showList()"
  ></app-course-info>
</ng-template>
